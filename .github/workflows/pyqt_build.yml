name: Build 飞羽播放器

on:
  workflow_dispatch: # 手动触发

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Windows)
      run: |
        pyinstaller --onefile --windowed --name "飞羽播放器" --add-data "Assets;Assets" --icon "Assets/app_icon.ico" mainrefector.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 飞羽播放器-windows
        path: dist/飞羽播放器.exe
        retention-days: 30

  build-linux:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install system dependencies for Qt
      run: |
        sudo apt-get update
        sudo apt-get install -y libgl1 libglib2.0-0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libxkbcommon0 libdbus-1-3

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Build with PyInstaller (Linux)
      run: |
        pyinstaller --onefile --windowed --name "飞羽播放器" --add-data "Assets:Assets" --icon "Assets/app_icon.ico" mainrefector.py

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: 飞羽播放器-linux
        path: dist/飞羽播放器
        retention-days: 30

  build-macos:
    runs-on: macos-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pyqt6 pyinstaller
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Build .app with PyInstaller (macOS)
      run: |
        # 使用 --windowed 生成 .app bundle，--noconfirm 覆盖旧构建
        pyinstaller --windowed --noconfirm --name "飞羽播放器" --add-data "Assets:Assets" --icon "Assets/app_icon.icns" mainrefector.py

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: 飞羽播放器-macos
        path: dist/飞羽播放器.app
        retention-days: 30
